name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Turns compiler and CMake errors into annotations on the run summary.
      - name: Register problem matchers
        shell: bash
        run: if [ -f .github/problem-matchers.json ]; then echo "::add-matcher::.github/problem-matchers.json"; fi

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          sdk: v5.11.2

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    # Combine whatever platforms built, even if one of them failed.
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: ['package']
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: out

      # Puts the .geode on the repo's Releases page, which is easier to download than an Actions artifact.
      - name: Publish the .geode as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "build-${{ github.run_number }}" out/*.geode \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Input Assist (build ${{ github.run_number }})" \
            --notes "Built by GitHub Actions from ${{ github.sha }}. Put the .geode file in your Geometry Dash geode/mods folder and restart the game."
